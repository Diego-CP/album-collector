name: AWS Auth Test

# Manual trigger only — run it to verify OIDC works
on:
  workflow_dispatch:

# Grant OIDC permission to mint the token
permissions:
  id-token: write
  contents: read

jobs:
  auth-test:
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3 # Latest
        with:
          role-to-assume: arn:aws:iam::822902368026:role/album-collector-github-actions
          aws-region: us-east-1

      - name: Test role assumption
        run: aws sts get-caller-identity
