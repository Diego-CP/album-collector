apiVersion: external-secrets.io/v1
# Cluster-scoped store - any namespace can point at it
kind: ClusterSecretStore
metadata:
  # Referenced in externalsecret.yaml 
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          # Authenticates as the ESO controller's k8s SA
          # in the external-secrets namespace
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
