apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: album-collector
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600 # auto-delete the finished Job after 10 min
  template:
    metadata:
      labels:
        job: db-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Replaced by the pipeline with the exact SHA-tagged image
          # being deployed, so migrations always match the code
          image: __IMAGE__
          workingDir: /app
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets # ESO-synced
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # URL-encode the password
              ENC_PW=$(node -e 'process.stdout.write(encodeURIComponent(process.env.DB_PASSWORD))')
              export DATABASE_URL="mysql://${DB_USER}:${ENC_PW}@${DB_HOST}:3306/${DB_NAME}"
              # Adjust --migrations-dir to where migrations live in the image
              dbmate --url "$DATABASE_URL" --migrations-dir ./app/db/migrations --no-dump-schema up
